name: tahfidz_quran
description: Aplikasi dasar Tahfidz Quran untuk belajar dan menyiapkan hafalan.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  just_audio: ^0.10.6
  geolocator: ^14.1.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_localizations:
    sdk: flutter
  geocoding: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/branding/
